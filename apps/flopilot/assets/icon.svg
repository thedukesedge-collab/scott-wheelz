<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a36"/><stop offset="1" stop-color="#05030f"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#8a3dff"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- horizon grid -->
  <g stroke="#3b2a8a" stroke-width="3" opacity="0.55">
    <line x1="0" y1="840" x2="1024" y2="840"/><line x1="0" y1="900" x2="1024" y2="900"/><line x1="0" y1="975" x2="1024" y2="975"/>
    <line x1="512" y1="800" x2="512" y2="1024"/><line x1="512" y1="800" x2="200" y2="1024"/><line x1="512" y1="800" x2="824" y2="1024"/>
    <line x1="512" y1="800" x2="-80" y2="1024"/><line x1="512" y1="800" x2="1104" y2="1024"/>
  </g>
  <!-- flight path -->
  <path d="M150 470 Q 380 140 800 210" fill="none" stroke="url(#path)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M770 160 L 860 205 L 775 262 Z" fill="#ffd36b" filter="url(#glow)"/>
  <!-- deck -->
  <rect x="120" y="555" width="784" height="70" rx="35" fill="url(#deck)" filter="url(#glow)"/>
  <!-- tire -->
  <g filter="url(#glow)">
    <circle cx="512" cy="590" r="205" fill="#05030f" stroke="#23f0ff" stroke-width="44"/>
    <circle cx="512" cy="590" r="120" fill="none" stroke="#23f0ff" stroke-width="10" opacity="0.6"/>
    <circle cx="512" cy="590" r="38" fill="#23f0ff"/>
  </g>
</svg>
