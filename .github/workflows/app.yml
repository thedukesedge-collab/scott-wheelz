# Re-Float Rink-Mixed phone app (apps/rinkmixed): analyze, test, build.
# Android APK on every push to apps/; the iPhone build runs when the commit
# message contains [ios] or when started by hand (macOS minutes are pricier).
name: App

on:
  push:
    branches: [main]
    paths: ['apps/rinkmixed/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build the iPhone app'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.5'
  APP: apps/rinkmixed
  FONT_URL: https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: ${{ env.APP }}
        run: |
          flutter create --platforms=android,ios --org com.rinkmixed --project-name rinkmixed .
          rm -f test/widget_test.dart
          python3 tools/patch_platforms.py .
          mkdir -p assets/fonts && curl -fsSL "$FONT_URL" -o assets/fonts/Orbitron.ttf
      - name: Analyze
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: ${{ env.APP }}
        run: flutter test
      - name: Screenshots
        working-directory: ${{ env.APP }}
        run: flutter test --update-goldens test_screens/ || true
      - name: Build APK
        working-directory: ${{ env.APP }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk rinkmixed.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease \
            --title "Rink-Mixed app (latest build)" --notes "Latest phone app builds from main."
          gh release edit app-latest --notes "Rink-Mixed app built from ${GITHUB_SHA::7}. Android: tap rinkmixed.apk to download and install."
          gh release upload app-latest "$APP/rinkmixed.apk" --clobber
          for f in $APP/test_screens/goldens/*.png; do [ -f "$f" ] && gh release upload app-latest "$f" --clobber; done

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: ${{ env.APP }}
        run: |
          flutter create --platforms=android,ios --org com.rinkmixed --project-name rinkmixed .
          rm -f test/widget_test.dart
          python3 tools/patch_platforms.py .
          mkdir -p assets/fonts && curl -fsSL "$FONT_URL" -o assets/fonts/Orbitron.ttf
      - name: Build (unsigned)
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr rinkmixed-unsigned.ipa Payload
      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease \
            --title "Rink-Mixed app (latest build)" --notes "Latest phone app builds from main."
          gh release upload app-latest "$APP/rinkmixed-unsigned.ipa" --clobber
