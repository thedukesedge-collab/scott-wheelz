# LCM firmware (lcm/alcm): build the .hex with arm-none-eabi-gcc (VP and
# stock), check it fits below the battery LUT block, run ALCM's unit tests
# (stock + VP builds). Main builds go to the "lcm-dev" release (bench
# testing only); a version tag (v1.2.3-rfNN) publishes the rider files to
# that release AND to "lcm-latest", which the app points riders to.
name: LCM firmware

on:
  push:
    branches: [main, 'lcm-*']
    paths: ['lcm/**', '.github/workflows/lcm.yml']
    # rider releases (E1): tags aren't filtered by paths
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # LCM firmware revision = commits that changed lcm/alcm

      # Arm's own toolchain release (13.2.Rel1, same version Ubuntu ships) -
      # Ubuntu's apt mirrors kept hanging this step
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Build (VP and stock)
        working-directory: lcm/alcm/gcc
        run: |
          arm-none-eabi-gcc --version | head -1
          make VP=0 || echo "stock GCC build does not fit (expected: Keil packs it tighter)"
          make VP=1
          ls -la build/*.hex
          make analyze || true

      - name: Bootloader (build + host tests)
        if: always()
        working-directory: lcm/bootloader
        run: |
          sh tests/run.sh
          make

      - name: Bootloader images (BL app + full hex + update image)
        if: always()
        run: |
          make -C lcm/alcm/gcc VP=1 BL=1
          python3 lcm/tools/lcm_images.py lcm/bootloader/build/lcm_bootloader.hex \
            lcm/alcm/gcc/build/ALCM_VP_BL_app.hex lcm/alcm/gcc/build "$(sh lcm/tools/lcm_version.sh)"
          ls -la lcm/alcm/gcc/build/ALCM_VP_BL_full.hex lcm/alcm/gcc/build/ALCM_VP_app.bin
          # the app's own .hex parser (ui.qml.in) must produce the same update image
          node tools/hexparse/test.js ui.qml.in lcm/alcm/gcc/build/

      - name: Runtime replacements (host test)
        if: always()
        working-directory: lcm/alcm/Library/HK32F030Mxx_Library_V1.1.6/HK32F030M_Project
        run: sh tests/tiny_rt/run.sh

      - name: Unit tests (stock + VP)
        if: always()
        working-directory: lcm/alcm/Library/HK32F030Mxx_Library_V1.1.6/HK32F030M_Project
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCLANG_TIDY_EXE=OFF
          cmake --build build -j4
          cd build && ctest --output-on-failure

      - name: Size report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcm-build
          path: |
            lcm/alcm/gcc/build/*.map
            lcm/alcm/gcc/build/*.hex
            lcm/alcm/gcc/build/*.bin
            lcm/alcm/gcc/build/analyze.txt
            lcm/bootloader/build/*
          if-no-files-found: ignore

      - name: Publish LCM dev build (main, bench testing only)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=lcm/alcm/gcc/build
          cp $F/ALCM_VP_BL_full.hex $F/SLCM.hex
          gh release delete lcm-dev --yes --cleanup-tag || true
          gh release create lcm-dev $F/SLCM.hex $F/ALCM_VP.hex $F/ALCM_VP_app.bin \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "DEV LCM firmware (${GITHUB_SHA::7}) - bench testing only, NOT for riding" \
            --notes "Untested SLCM build from ${GITHUB_SHA::7}. Riders: use SLCM.hex from the lcm-latest release."

      - name: Publish LCM rider release (tag v<version>)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(cat version)"
          if [ "$TAG" != "v$VER" ]; then
            echo "Tag $TAG doesn't match the version file (v$VER): not publishing."
            exit 1
          fi
          F=lcm/alcm/gcc/build
          cp $F/ALCM_VP_BL_full.hex $F/SLCM.hex
          # the version release (ci.yml adds the .vescpkg; whichever comes first creates it)
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --verify-tag \
                --title "Re-Float Rink-Mixed $VER" \
                --notes-file tools/release_notes.md && break
            sleep 15
          done
          gh release upload "$TAG" $F/SLCM.hex $F/ALCM_VP_app.bin --clobber
          # lcm-latest (linked from the app) = the SLCM of the latest rider release
          gh release view lcm-latest >/dev/null 2>&1 || gh release create lcm-latest --prerelease --latest=false \
            --title "LCM firmware (SLCM)" --notes "SLCM" --target "$GITHUB_SHA"
          gh release edit lcm-latest --notes "SLCM (ALCM v0.1.1 + VP light control) from Re-Float Rink-Mixed $VER (${GITHUB_SHA::7}). SLCM.hex = bootloader + light firmware: flash ONCE with the ST-Link (battery disconnected), after that update from the app (LEDS > LCM firmware tools). ALCM_VP.hex = the same light firmware without the bootloader (ST-Link only, not recommended). ALCM_VP_app.bin = the update image. See lcm/bootloader/README.md."
          gh release upload lcm-latest $F/ALCM_VP.hex $F/SLCM.hex $F/ALCM_VP_app.bin --clobber
          gh release delete-asset lcm-latest ALCM_VP_BL_full.hex -y 2>/dev/null || true
