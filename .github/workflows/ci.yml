name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: nixpkgs#llvmPackages_18.clang-tools, nixpkgs#pre-commit

      - name: Run clang-format
        id: clang-format
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: Build Package
        id: build
        if: success() || (failure() && steps.clang-format.conclusion == 'failure')
        uses: ./.github/actions/build
        with:
          cache-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Upload Package
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rinkfloat-vescpkg
          path: rinkfloat.vescpkg

      # Re-RinkFloat: publish each main-branch build as a direct download
      # (Releases > "Latest build"), so phones get the .vescpkg itself
      # instead of a zip.
      - name: Publish latest build
        if: always() && steps.build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build rinkfloat.vescpkg \
            --prerelease \
            --title "Latest build" \
            --notes "Re-RinkFloat built from commit ${GITHUB_SHA::7}. Tap rinkfloat.vescpkg below to download." \
            --target "$GITHUB_SHA"
