name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # LCM firmware revision = commits that changed lcm/alcm
      - uses: cachix/install-nix-action@v25
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          flakes: nixpkgs#llvmPackages_18.clang-tools, nixpkgs#pre-commit

      - name: Run clang-format
        id: clang-format
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: Build Package
        id: build
        if: success() || (failure() && steps.clang-format.conclusion == 'failure')
        uses: ./.github/actions/build
        with:
          cache-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # rf75 safety: stack usage of every function (no LTO), compared with
      # upstream Refloat v1.2.3; fails if any single frame is over 512 bytes
      # host unit tests of the light module protocol (src/lcm.c) and battery
      # curve; rf78: run on every build (rf77 broke them unnoticed)
      - name: Light module unit tests
        run: sh tools/lcm_vp_test/run.sh

      - name: Stack usage report
        if: steps.build.outcome == 'success'
        run: |
          git clone -q --depth 1 --branch v1.2.3 https://github.com/lukash/refloat /tmp/upstream
          nix shell nixpkgs/nixos-24.11#gcc-arm-embedded-13 -c sh tools/stack_report.sh /tmp/upstream/src

      # Refloat Glow: static analysis (clang-tidy: clang static analyzer +
      # bug-prone patterns); fails on findings in files changed by the fork
      - name: Static analysis
        if: steps.build.outcome == 'success'
        run: |
          [ -d /tmp/upstream ] || git clone -q --depth 1 --branch v1.2.3 https://github.com/lukash/refloat /tmp/upstream
          sh tools/static_analysis.sh /tmp/upstream/src

      # rf143: BACK TO REFLOAT 1.2.3 promises the rider's tune carries over.
      # That holds only while our Refloat settings signature equals stock
      # 1.2.3's, so the build fails if it ever drifts (e.g. a settings.xml edit).
      - name: Settings signature matches stock Refloat 1.2.3
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OURS=$(sed -n 's/^#define .\+_SIGNATURE\W\+\([0-9]*\)/\1/p' src/conf/confparser.h)
          gh release download v1.2.3 -R lukash/refloat -p config_signature.txt -O /tmp/stock_sig.txt
          STOCK=$(tr -d '[:space:]' < /tmp/stock_sig.txt)
          echo "Refloat Glow: $OURS  stock 1.2.3: $STOCK"
          [ -n "$OURS" ] && [ "$OURS" = "$STOCK" ] || { echo "::error::Settings signature differs from stock 1.2.3: BACK TO REFLOAT 1.2.3 would reset riders' tunes"; exit 1; }

      - name: Upload Package
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: refloatrm-vescpkg
          path: refloatrm.vescpkg

      # E1 (rf77): riders only get TAGGED releases. A push to main is a dev
      # build for bench testing; a tag v<version> (e.g. v1.2.3-rf77, must
      # match the version file) is a rider release that stays downloadable.
      # See RELEASING.md.
      - name: Publish dev build (main, bench testing only)
        if: always() && steps.build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the old "Latest build" (main builds for riders) is retired
          gh release delete latest-build --yes --cleanup-tag || true
          gh release delete dev-build --yes --cleanup-tag || true
          cp refloatrm.vescpkg refloatrm-dev.vescpkg
          gh release create dev-build refloatrm-dev.vescpkg \
            --prerelease --latest=false \
            --title "DEV build $(cat version) (${GITHUB_SHA::7}) - bench testing only, NOT for riding" \
            --notes "Untested development build of Refloat Glow $(cat version) from commit ${GITHUB_SHA::7}. For bench testing with the wheel off the ground only. Riders: use the latest release (Releases > Latest). Refloat Glow is an unofficial modification of Refloat by Lukas Hrazky, not affiliated with or endorsed by the Refloat developers. License: GPL-3.0-or-later (LICENSE); full source of this build: https://github.com/thedukesedge-collab/scott-wheelz/tree/${GITHUB_SHA}; third-party notices: THIRD_PARTY_NOTICES.md." \
            --target "$GITHUB_SHA"

      # lcm-powerclicks: firmware experiment (SLCM power-button click actions)
      # on its own pre-release; main's dev-build is untouched
      - name: Publish lcm-powerclicks dev build (branch lcm-powerclicks only)
        if: always() && steps.build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/lcm-powerclicks'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one test release for the package AND the SLCM (lcm.yml adds
          # SLCM.hex + slcm-<version>.txt): the test package's CHECK FOR
          # UPDATES reads it. Not deleted each time (that would drop the SLCM).
          for i in 1 2 3 4 5; do
            gh release view powerclicks-dev >/dev/null 2>&1 || \
              gh release create powerclicks-dev --prerelease --latest=false --target "$GITHUB_SHA" \
                --title "powerclicks TEST" --notes "test" && break
            sleep 15
          done
          gh release edit powerclicks-dev --prerelease --latest=false \
            --title "powerclicks TEST $(cat version) (${GITHUB_SHA::7}) - package + SLCM firmware change, bench testing only, NOT for riding" \
            --notes "Experimental Refloat Glow build (branch lcm-powerclicks): power-button click actions for SLCM boards. refloatglow-powerclicks-dev.vescpkg (= refloatrm.vescpkg) is the test package; SLCM.hex is the matching SLCM (the test package's CHECK FOR UPDATES offers it, flashed over BLE). Bench test with the wheel off the ground first. Refloat Glow is an unofficial modification of Refloat by Lukas Hrazky, not affiliated with or endorsed by the Refloat developers. License: GPL-3.0-or-later (LICENSE); full source of this build: https://github.com/thedukesedge-collab/scott-wheelz/tree/${GITHUB_SHA}; third-party notices: THIRD_PARTY_NOTICES.md."
          cp refloatrm.vescpkg refloatglow-powerclicks-dev.vescpkg
          gh release upload powerclicks-dev refloatglow-powerclicks-dev.vescpkg refloatrm.vescpkg --clobber

      - name: Publish rider release (tag v<version>)
        if: steps.build.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(cat version)"
          if [ "$TAG" != "v$VER" ]; then
            echo "Tag $TAG doesn't match the version file (v$VER): not publishing."
            exit 1
          fi
          # (lcm.yml adds SLCM.hex to the same release; whichever comes first creates it)
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --verify-tag --latest \
                --title "Refloat Glow $VER" \
                --notes-file tools/release_notes.md && break
            sleep 15
          done
          gh release upload "$TAG" refloatrm.vescpkg --clobber
          gh release edit "$TAG" --latest
